<p>Reports a <code>Type</code> that names none of the eight state types: Task, Pass, Choice, Wait, Succeed, Fail, Parallel and Map. Names are case-sensitive.</p>
<p>AWS documents that it rejects such a definition, so this is reported as an error. A type that contains a placeholder is not checked.</p>
