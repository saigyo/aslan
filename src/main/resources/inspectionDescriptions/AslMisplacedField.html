<p>Reports a field that the Amazon States Language defines, used on a state type or structure that does not take it, such as <code>Next</code> on a Succeed state, or <code>Next</code> in a Choice rule nested in <code>And</code>, <code>Or</code> or <code>Not</code>.</p>
<p>It is only a warning: AWS does not document that it rejects such a definition.</p>
