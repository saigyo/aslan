name: Release

# Pushing a tag such as v0.9.1 builds the plugin from that commit, with the version of the tag, and publishes a GitHub release
# with the plugin zip attached. Nothing is released when a check fails.
on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The verifier downloads and unpacks two full IDEs, which does not fit
      # on a hosted runner next to the preinstalled SDKs.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::The tag $TAG is not a version such as v0.9.1"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit is not on main"
            exit 1
          fi
          if ! tools/release/notes.sh | sed -n 1p | grep -Fq "<p>$version:"; then
            echo "::error::The change notes in plugin.xml do not start with $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # the version of the build is the version of the tag
      - run: ./gradlew check buildPlugin verifyPlugin -Pversion="$VERSION"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: |
            build/reports/tests
            build/reports/pluginVerifier
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          zip="build/distributions/aslan-$VERSION.zip"
          test -f "$zip"
          tools/release/notes.sh > "$RUNNER_TEMP/notes.html"
          gh release create "$TAG" "$zip" --verify-tag --title "Aslan $VERSION" --notes-file "$RUNNER_TEMP/notes.html"
