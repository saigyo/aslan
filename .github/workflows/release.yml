name: Release

# Pushing a tag such as v1.0.1 builds the plugin from that commit, with the version of the tag, signs it, and publishes a
# GitHub release with the signed zip attached. When the repository variable MARKETPLACE_UPLOAD is true, the same zip is then
# uploaded to the JetBrains Marketplace, where it waits for JetBrains' review. Nothing is released when a check fails.
# The secrets CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD and MARKETPLACE_TOKEN are set up with tools/release/signing.sh.
#
# The secrets live in the environment 'release', not in the repository. GitHub hands them to a job only after the
# environment's rules pass: the run comes from a v* tag, and the repository owner approves the job in the Actions tab.
# So a workflow changed on another branch or tag cannot read them, and nothing is signed or uploaded without approval.
# Both jobs wait for an approval of their own: the second one is the moment to check the GitHub release before the zip
# goes to JetBrains. If the environment is ever recreated, restore both rules (Settings | Environments | release).
# The actions are pinned to commit hashes, so that no one can change the code that runs next to the secrets by moving a
# tag. Dependabot (.github/dependabot.yml) proposes updates of the hashes as pull requests.
on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 60
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      # The verifier downloads and unpacks two full IDEs, which does not fit
      # on a hosted runner next to the preinstalled SDKs.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::The tag $TAG is not a version such as v0.9.1"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit is not on main"
            exit 1
          fi
          if ! tools/release/notes.sh | sed -n 1p | grep -Fq "<p>$version:"; then
            echo "::error::The change notes in plugin.xml do not start with $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the signing key
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_CHAIN" ] || [ -z "$PRIVATE_KEY" ] || [ -z "$PRIVATE_KEY_PASSWORD" ]; then
            echo "::error::The secrets for signing are missing; set them up in the environment release with tools/release/signing.sh"
            exit 1
          fi
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # the version of the build is the version of the tag
      - run: ./gradlew check buildPlugin verifyPlugin signPlugin verifyPluginSignature -Pversion="$VERSION"
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: reports
          path: |
            build/reports/tests
            build/reports/pluginVerifier
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The signed zip, under the name of the plugin's zip. When a retry finds the release made by an earlier
          # attempt, the zip of that release is passed on, so that GitHub and the Marketplace get the same bytes.
          mkdir -p dist
          zip="dist/aslan-$VERSION.zip"
          if gh release view "$TAG" > /dev/null 2>&1; then
            if ! gh release download "$TAG" --pattern "aslan-$VERSION.zip" --dir dist --clobber; then
              cp "build/distributions/aslan-$VERSION-signed.zip" "$zip"
              gh release upload "$TAG" "$zip"
            fi
          else
            cp "build/distributions/aslan-$VERSION-signed.zip" "$zip"
            tools/release/notes.sh > "$RUNNER_TEMP/notes.html"
            gh release create "$TAG" "$zip" --verify-tag --title "Aslan $VERSION" --notes-file "$RUNNER_TEMP/notes.html"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: dist/aslan-${{ env.VERSION }}.zip
          if-no-files-found: error
          overwrite: true

  marketplace:
    name: Upload to the JetBrains Marketplace
    needs: release
    # Off until the first version has been uploaded by hand and approved; then set the variable to true.
    if: vars.MARKETPLACE_UPLOAD == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: plugin
      - name: Upload the signed zip
        env:
          TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::The secret MARKETPLACE_TOKEN is missing; set it up in the environment release with tools/release/signing.sh"
            exit 1
          fi
          curl --fail-with-body -sS https://plugins.jetbrains.com/api/updates/upload \
            -H "Authorization: Bearer $TOKEN" \
            -F xmlId=io.github.saigyo.aslan \
            -F "file=@aslan-$VERSION.zip"
