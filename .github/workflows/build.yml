name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check buildPlugin
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: build/reports/tests
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: build/distributions/*.zip

  verify:
    name: Verify IDE compatibility
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The verifier downloads and unpacks two full IDEs, which does not fit
      # on a hosted runner next to the preinstalled SDKs.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew verifyPlugin
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier
