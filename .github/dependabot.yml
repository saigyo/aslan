version: 2
updates:
  # The actions of the workflows are pinned to commit hashes; Dependabot proposes new hashes, with their version in the
  # comment, as pull requests.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
